// 页面切换
function switchPage(pageId){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
}

// 密码校验
function checkPassword(){
    const inputVal = document.getElementById('pwdInput').value.trim();
    if(inputVal === PASSWORD){
        currentQuestion = 0;
        traitScores = {restrained:0, orderly:0, romantic:0, avantgarde:0, sculptural:0, laidback:0};
        renderQuestion();
        switchPage("page-quiz");
    }else{
        alert("密码错误，请重新输入");
    }
}

//渲染题目
function renderQuestion(){
    const q = questions[currentQuestion];
    document.getElementById("questionText").innerText = q.q;
    document.getElementById("qNum").innerText = `${currentQuestion+1}/10`;
    const progress = ((currentQuestion)/10)*100;
    document.getElementById("progressFill").style.width = `${progress}%`;
    const optWrap = document.getElementById("optionWrap");
    optWrap.innerHTML = "";
    let selected = null;
    q.o.forEach((opt,idx)=>{
        const div = document.createElement("div");
        div.className = "option-item";
        div.innerHTML = `<span class="opt-letter">${opt.letter}</span><span class="opt-desc">${opt.text}</span>`;
        div.onclick = ()=>{
            document.querySelectorAll(".option-item").forEach(item=>item.classList.remove("selected"));
            div.classList.add("selected");
            selected = opt;
            //计分
            for(let k in opt.score){
                traitScores[k] += opt.score[k];
            }
            document.getElementById("nextBtn").disabled = false;
        }
        optWrap.appendChild(div);
    })
    document.getElementById("nextBtn").disabled = true;
}

//下一题
function goNext(){
    currentQuestion++;
    if(currentQuestion >= questions.length){
        renderResult();
        switchPage("page-result");
        return;
    }
    renderQuestion();
}

// 从数组随机选一项
function randomPick(arr){
    return arr[Math.floor(Math.random() * arr.length)];
}

//渲染结果页面
function renderResult(){
    // 1. 计算总分，归一化，6项百分比总和严格=100%
    const totalScore = Object.values(traitScores).reduce((sum,val)=>sum+val,0);
    const traitPercent = {};
    if(totalScore === 0){
        traitPercent.restrained = traitPercent.orderly = traitPercent.romantic = traitPercent.avantgarde = traitPercent.sculptural = traitPercent.laidback = 100/6;
    }else{
        for(let key in traitScores){
            traitPercent[key] = traitScores[key] / totalScore * 100;
        }
    }

    // 排序：按分数从高到低，取出TOP3特质
    const sortedTraits = Object.entries(traitScores).sort((a,b)=>b[1]-a[1]);
    const top1Key = sortedTraits[0][0];
    const top2Key = sortedTraits[1][0];
    const top3Key = sortedTraits[2][0];

    // 主文案使用第一名特质
    const gene = itemPool[top1Key];
    document.getElementById("geneSlogan").innerText = gene.slogan;
    document.getElementById("personDesc").innerText = gene.desc;

    // 6个审美特质进度条
    let traitHtml = "";
    traitMeta.forEach(t=>{
        const pct = traitPercent[t.key];
        traitHtml += `
        <div class="trait-row">
            <div class="trait-top">
                <span class="trait-name">${t.name}</span>
                <span class="trait-percent">${pct.toFixed(1)}%</span>
            </div>
            <div class="bar-bg">
                <div class="bar-fill" style="width:${pct}%"></div>
            </div>
        </div>
        `;
    })
    document.getElementById("traitWrap").innerHTML = traitHtml;

    // 分配：包包=TOP1，珠宝=TOP2，腕表=TOP3，香水=TOP1随机
    const bagItem = randomPick(itemPool[top1Key].bag);
    const jewelItem = randomPick(itemPool[top2Key].jewel);
    const watchItem = randomPick(itemPool[top3Key].watch);
    const perfumeItem = randomPick(itemPool[top1Key].perfume);

    // 4大类推荐模块
    let recHtml = "";
    recHtml += `
        <div class="recommend-block">
            <div class="recommend-title">👜包包（匹配你的第一审美特质）</div>
            <div class="recommend-item-name">${bagItem.name}</div>
            <div class="recommend-item-desc">${bagItem.desc}</div>
        </div>
        <div class="recommend-block">
            <div class="recommend-title">💎珠宝（匹配你的第二审美特质）</div>
            <div class="recommend-item-name">${jewelItem.name}</div>
            <div class="recommend-item-desc">${jewelItem.desc}</div>
        </div>
        <div class="recommend-block">
            <div class="recommend-title">⌚腕表（匹配你的第三审美特质）</div>
            <div class="recommend-item-name">${watchItem.name}</div>
            <div class="recommend-item-desc">${watchItem.desc}</div>
        </div>
        <div class="recommend-block">
            <div class="recommend-title">🧴香水（匹配你的第一审美特质）</div>
            <div class="recommend-item-name">${perfumeItem.name}</div>
            <div class="recommend-item-desc">${perfumeItem.desc}</div>
        </div>
    `;
    document.getElementById("recommendWrap").innerHTML = recHtml;
}
